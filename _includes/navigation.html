<header class="ca-header">
  <nav class="ca-shell ca-nav" aria-label="Main navigation">
    <a class="ca-brand" href="{{ '/' | relative_url }}"><span class="ca-brand-mark" aria-hidden="true">c<span>ai</span></span>Channel AI<span class="ca-brand-dot" aria-hidden="true">.</span></a>
    <button class="ca-menu-button" type="button" aria-expanded="false" aria-controls="ca-nav-links" hidden>Menu <span aria-hidden="true">☰</span></button>
    <ul class="ca-nav-links" id="ca-nav-links">
      {% for item in site.data.navigation %}
      <li><a href="{{ item.link | relative_url }}" {% if page.url == item.link %}aria-current="page"{% endif %}>{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
